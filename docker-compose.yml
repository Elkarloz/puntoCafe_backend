services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/cafeteria
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-604800}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-luzdary@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-40769183}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Luz Dary}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
